server:
  port: 8083
spring:
  application:
    name: product-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/realms/secure-order}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app-dev-password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
